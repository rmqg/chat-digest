name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the GitHub release and upload assets
  id-token: write        # sign the build provenance attestation
  attestations: write    # store the attestation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests before packaging
        env:
          PYTHONPATH: .:deployment:agent_console
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
        run: |
          python -m pip install -r requirements-dev.txt
          python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
          python -m pytest -q
          python scripts/audit-release.py
      - name: Build release archive (same script as local builds)
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          python scripts/release-notes.py "$GITHUB_REF_NAME" > "$notes"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "chat-digest $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
