name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prewarm token data for deterministic tests
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
        run: |
          python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
          printf 'TIKTOKEN_CACHE_DIR=%s\n' "$TIKTOKEN_CACHE_DIR" >> "$GITHUB_ENV"
      - name: Unit and offline demo tests
        env:
          PYTHONPATH: .:deployment:agent_console
        run: python -m pytest -q
      - name: Documentation, examples and safe CLI help
        run: python scripts/check-docs.py --cli
      - name: Release boundary audit
        run: python scripts/audit-release.py
      - name: Offline demo through the CLI (no network needed by the demo itself)
        run: |
          CHAT_DIGEST_PYTHON=python ./bin/chat-digest demo --output "$RUNNER_TEMP/demo"
          CHAT_DIGEST_PYTHON=python ./bin/chat-digest doctor --demo-only
          CHAT_DIGEST_PYTHON=python ./bin/chat-digest demo --qq --output "$RUNNER_TEMP/qq-demo"
      - name: Installer and service files
        run: |
          sh -n scripts/install.sh scripts/build-release.sh bin/chat-digest
          ./scripts/install.sh
          for unit in deployment/services/systemd/*.service; do grep -q '^ExecStart=' "$unit"; done
      - name: Build isolated runtime image and exercise CLI
        if: matrix.python == '3.12'
        run: |
          docker build --build-arg WITH_OCR=1 -t chat-digest-runtime:ci .
          docker run --rm --network none --read-only --cap-drop ALL chat-digest-runtime:ci /tool/digest.py --help
          docker run --rm --network none --read-only --cap-drop ALL chat-digest-runtime:ci /tool/qq_service.py --help
          docker run --rm --network none --read-only --cap-drop ALL chat-digest-runtime:ci -c "from ocr_images import _create_ocr, _recognize; from PIL import Image,ImageDraw,ImageFont; import io; image=Image.new('RGB',(500,130),'white'); ImageDraw.Draw(image).text((20,20),'123456',fill='black',font=ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',64)); data=io.BytesIO(); image.save(data,format='PNG'); text,lines,confidence=_recognize(data.getvalue(),_create_ocr()); assert '123456' in text.replace(' ',''); print('real OCR digits verified')"
